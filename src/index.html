<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Noviflix</title>
  <base href="/">
  <!--
    viewport-fit=cover extends the page under the status bar and the home
    indicator. Without it iOS keeps those bands for itself and paints them a flat
    colour, which broke the drum field into a lattice with a plain strip above and
    below it. With it, the pinned pad layer reaches the physical screen edges and
    the grid is continuous; safe-area insets then keep content clear of the notch.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Discover how you watch.">
  <!-- Matches the pads, so the band iOS paints before first render blends in. -->
  <meta name="theme-color" content="#0a0c0d">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://api.themoviedb.org">
  <link rel="preconnect" href="https://image.tmdb.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
  >
</head>
<body>
  <nv-root></nv-root>
</body>
</html>
