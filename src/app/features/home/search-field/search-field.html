@let error = message();

<div class="sf" role="search" [class.is-invalid]="error">
  <nv-drum-card [active]="focused() || !!error">
    <div class="sf__row">
      <span class="sf__icon" [class.is-busy]="busy()">
        @if (busy()) {
          <svg class="sf__spinner" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.4-3.4" />
          </svg>
        }
      </span>

      <input
        #field
        class="sf__input"
        type="search"
        autocomplete="off"
        nvSearchTerm
        [formControl]="term"
        [placeholder]="i18n.t('search.placeholder')"
        [attr.aria-label]="i18n.t('search.label')"
        [attr.aria-invalid]="error ? 'true' : null"
        [attr.aria-describedby]="error ? 'nv-search-error' : null"
        (focus)="focused.set(true)"
        (blur)="onBlur()"
      />

      @if (hasValue()) {
        <button
          type="button"
          class="sf__clear"
          [attr.aria-label]="i18n.t('search.clear')"
          (click)="clear()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      }

      <span class="sf__status" role="status">
        @if (busy()) {
          {{ i18n.t('search.searching') }}
        }
      </span>
    </div>
  </nv-drum-card>

  <p class="sf__error" id="nv-search-error" role="alert">
    @if (error) {
      {{ error }}
    }
  </p>
</div>
