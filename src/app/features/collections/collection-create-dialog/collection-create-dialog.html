@if (open()) {
  <div class="cd">
    <div class="cd__scrim" (click)="close()"></div>

    <form
      class="cd__panel"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="heading()"
      [formGroup]="form"
      (ngSubmit)="submit()"
      novalidate
    >
      <h2 class="cd__title">{{ heading() }}</h2>

      @if (pending().length; as count) {
        <p class="cd__lead">
          {{ i18n.t('collections.createWithFilms', { count: count }) }}
        </p>
      } @else if (isEditing()) {
        <p class="cd__lead">{{ i18n.t('collections.editLead') }}</p>
      } @else {
        <p class="cd__lead">{{ i18n.t('collections.createLead') }}</p>
      }

      <label class="cd__field">
        <span class="cd__label">
          {{ i18n.t('collections.fieldTitle') }}
          <span class="cd__counter" [class.is-over]="nameLength() > titleMax">
            {{ nameLength() }}/{{ titleMax }}
          </span>
        </span>

        <input
          #field
          class="cd__input"
          type="text"
          formControlName="name"
          autocomplete="off"
          [attr.aria-invalid]="nameError() ? 'true' : null"
          [placeholder]="i18n.t('collections.fieldTitlePlaceholder')"
          (blur)="touch('name')"
        />

        <p class="cd__error" role="alert">
          @if (nameError(); as error) {
            {{ error }}
          }
        </p>
      </label>

      <label class="cd__field">
        <span class="cd__label">
          {{ i18n.t('collections.fieldDescription') }}
          <span class="cd__counter" [class.is-over]="descriptionLength() > descriptionMax">
            {{ descriptionLength() }}/{{ descriptionMax }}
          </span>
        </span>

        <textarea
          class="cd__input cd__input--area"
          formControlName="description"
          rows="3"
          [attr.aria-invalid]="descriptionError() ? 'true' : null"
          [placeholder]="i18n.t('collections.fieldDescriptionPlaceholder')"
          (blur)="touch('description')"
        ></textarea>

        <p class="cd__error" role="alert">
          @if (descriptionError(); as error) {
            {{ error }}
          }
        </p>
      </label>

      <div class="cd__actions">
        <button type="submit" class="cd__submit" [disabled]="!canSubmit()">
          {{ submitLabel() }}
        </button>
        <button type="button" class="cd__cancel" (click)="close()">
          {{ i18n.t('collections.cancel') }}
        </button>
      </div>
    </form>
  </div>
}
