@let list = collection();

<nv-drum-card [flat]="true" [interactive]="true">
  <!--
    A button, not a link. The films open in a pop-up over this page rather than at an address of
    their own, so there is nowhere for a link to point.
  -->
  <button
    type="button"
    class="cc"
    aria-haspopup="dialog"
    [attr.aria-label]="i18n.t('collections.open', { name: list.name })"
    (click)="open.emit()"
  >
    @if (covers().length) {
      <!-- A mosaic, so the square fills whether there is one cover or four. -->
      <span class="cc__mosaic" [attr.data-count]="covers().length" aria-hidden="true">
        @for (cover of covers(); track cover) {
          <img [src]="cover" [alt]="" loading="lazy" />
        }
      </span>
    } @else {
      <span class="cc__empty" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="4" width="20" height="16" rx="2.5" />
          <path d="M7 4v16M17 4v16" />
        </svg>
      </span>
    }

    <!-- Reads over the covers, so the mosaic keeps the whole square. -->
    <span class="cc__scrim" aria-hidden="true"></span>

    <span class="cc__foot">
      <span class="cc__text">
        <span class="cc__rank">#{{ index() + 1 }}</span>
        <span class="cc__name">{{ list.name }}</span>
        <span class="cc__count">
          {{ i18n.t('collections.count', { count: total() }) }}
        </span>
      </span>

      <span class="cc__go" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="m9 6 6 6-6 6" />
        </svg>
      </span>
    </span>
  </button>
</nv-drum-card>
