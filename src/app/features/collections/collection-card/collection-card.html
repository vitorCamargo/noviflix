@let list = collection();

<nv-drum-card [interactive]="true">
  <a
    class="cc"
    [routerLink]="['/collections', list.id]"
    [attr.aria-label]="i18n.t('collections.open', { name: list.name })"
  >
    <span class="cc__art">
      @if (posters().length) {
        <!-- A mosaic, so the tile fills whether there are one or four posters. -->
        <span class="cc__mosaic" [attr.data-count]="posters().length" aria-hidden="true">
          @for (poster of posters(); track poster) {
            <img [src]="poster" [alt]="" loading="lazy" />
          }
        </span>
      } @else {
        <span class="cc__empty" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="2" y="4" width="20" height="16" rx="2.5" />
            <path d="M7 4v16M17 4v16" />
          </svg>
        </span>
      }

      <span class="cc__count">
        {{ i18n.t('collections.count', { count: total() }) }}
      </span>
    </span>

    <span class="cc__meta">
      <span class="cc__title">{{ list.name }}</span>
      @if (list.description) {
        <span class="cc__description">{{ list.description }}</span>
      }
    </span>
  </a>
</nv-drum-card>
