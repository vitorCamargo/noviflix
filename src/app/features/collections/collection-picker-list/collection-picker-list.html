<div class="pl">
  <div class="pl__search">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-3.4-3.4" />
    </svg>
    <input
      #search
      type="search"
      autocomplete="off"
      [value]="query()"
      [placeholder]="i18n.t('collections.find')"
      [attr.aria-label]="i18n.t('collections.find')"
      (input)="onQuery($event)"
    />
  </div>

  <button type="button" class="pl__create" (click)="createNew()">
    <span class="pl__create-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
    </span>
    <span>{{ i18n.t('collections.new') }}</span>
  </button>

  <hr class="pl__rule" />

  @if (matches().length) {
    <ul class="pl__list">
      @for (collection of matches(); track collection.id) {
        <li>
          <button type="button" class="pl__item" (click)="addTo(collection)">
            <span class="pl__item-name">{{ collection.name }}</span>
            <span class="pl__item-meta">
              {{ i18n.t('collections.count', { count: collection.items.length }) }}
              @if (present(collection); as already) {
                <span class="pl__item-already">
                  {{ i18n.t('collections.alreadyIn', { count: already }) }}
                </span>
              }
            </span>
          </button>
        </li>
      }
    </ul>
  } @else if (hasAny()) {
    <p class="pl__empty">{{ i18n.t('collections.noMatch') }}</p>
  } @else {
    <p class="pl__empty">{{ i18n.t('collections.pickerEmpty') }}</p>
  }
</div>
