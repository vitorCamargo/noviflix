<!--
  Glow sits at the very bottom. The drum pads now live inside each page's grid
  (see PageGrid), so the glow shows through the seams of whatever page is on
  screen and travels with it as the track scrolls.
-->
<nv-mouse-glow />

<div class="shell">
  <nv-site-header />

  <main class="shell__main nv-track" nvHorizontalScroll>
    <router-outlet />

    <!--
      Inside the track, not beside it. The overlay swallows pointer events while
      scrolling, and wheel events are pointer events: sitting outside the track
      it became the wheel target and the track stopped receiving any. As a
      descendant, wheel still bubbles up to the track while hover stays blocked.
    -->
    <nv-scroll-overlay />
  </main>
</div>

<!-- Details pop-up renders above the shell, driven by the `modal` outlet. -->
<router-outlet name="modal" />

<!--
  Rendered once here rather than per page: the picker is opened from the search results and
  from a film's own pop-up, and a second copy would let two overlays open at once.
-->
<!--
  Selection is global — a film can be marked on the results grid, in a related strip inside the
  details pop-up, or on a details page — so the bar acting on it lives here rather than in any one
  of them.
-->
<nv-selection-bar />

<nv-collection-picker />
<nv-collection-create-dialog />
<nv-toast />

<nv-scroll-hint />
<nv-scroll-top />
<nv-cursor />
